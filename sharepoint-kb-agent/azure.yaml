# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# The knowledge base, its connection and the toolbox are created by the scripts in ../setup.
# This manifest defines only the hosted agent; at runtime it reaches the toolbox via TOOLBOX_NAME.
requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: sharepoint-kb-agent
services:
    sharepoint-kb-agent:
        project: src/sharepoint-kb-agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: A hosted agent that answers questions from SharePoint through a Foundry IQ knowledge base, on behalf of the signed-in user.
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: TOOLBOX_NAME
              value: ${TOOLBOX_NAME}
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Responses Protocol
                - SharePoint
                - Foundry IQ
                - Knowledge Base
        name: sharepoint-kb-agent
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments: []
infra:
    provider: microsoft.foundry
